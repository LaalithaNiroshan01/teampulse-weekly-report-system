<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810"><rect width="1200" height="810" fill="#f8fafc"/><text x="50" y="55" font-family="Arial" font-size="28" font-weight="bold" fill="#0f172a">TeamPulse - Entity Relationships</text><g stroke="#64748b" stroke-width="2" fill="none"><path d="M200 320V430"/><path d="M920 320V365H460V430"/><path d="M520 560H670"/><path d="M370 185H600V400H950V430"/></g><g font-family="Arial" font-size="15" fill="#475569"><text x="210" y="375">1 authors many</text><text x="700" y="352">1 categorizes many</text><text x="530" y="545">1 contains many</text><text x="610" y="385">1 reviewer : many reviews</text></g><rect x="50" y="110" width="320" height="210" rx="12" fill="white" stroke="#cbd5e1"/><rect x="50" y="110" width="320" height="42" rx="12" fill="#0f172a"/><text x="66" y="138" fill="white" font-family="Arial" font-weight="bold" font-size="17">USER</text><text x="66" y="178" font-family="Arial" font-size="14" fill="#334155">_id (PK), name, email (unique)</text><text x="66" y="202" font-family="Arial" font-size="14" fill="#334155">password hash</text><text x="66" y="226" font-family="Arial" font-size="14" fill="#334155">role: member | manager</text><text x="66" y="250" font-family="Arial" font-size="14" fill="#334155">title, department, isActive</text><text x="66" y="274" font-family="Arial" font-size="14" fill="#334155">createdAt, updatedAt</text><rect x="750" y="110" width="350" height="210" rx="12" fill="white" stroke="#cbd5e1"/><rect x="750" y="110" width="350" height="42" rx="12" fill="#0f172a"/><text x="766" y="138" fill="white" font-family="Arial" font-weight="bold" font-size="17">PROJECT</text><text x="766" y="178" font-family="Arial" font-size="14" fill="#334155">_id (PK), name (unique)</text><text x="766" y="202" font-family="Arial" font-size="14" fill="#334155">description, color, isActive</text><text x="766" y="226" font-family="Arial" font-size="14" fill="#334155">assignedMembers[] -&gt; User (optional)</text><text x="766" y="250" font-family="Arial" font-size="14" fill="#334155">createdAt, updatedAt</text><rect x="50" y="430" width="470" height="270" rx="12" fill="white" stroke="#cbd5e1"/><rect x="50" y="430" width="470" height="42" rx="12" fill="#0f172a"/><text x="66" y="458" fill="white" font-family="Arial" font-weight="bold" font-size="17">REPORT</text><text x="66" y="498" font-family="Arial" font-size="14" fill="#334155">_id (PK), userId -&gt; User, projectId -&gt; Project</text><text x="66" y="522" font-family="Arial" font-size="14" fill="#334155">weekStartDate, weekEndDate, weekNumber, year</text><text x="66" y="546" font-family="Arial" font-size="14" fill="#334155">status: draft / submitted / needs_correction / approved</text><text x="66" y="570" font-family="Arial" font-size="14" fill="#334155">tasksCompleted[], tasksPlannedNextWeek[]</text><text x="66" y="594" font-family="Arial" font-size="14" fill="#334155">blockers[] (key issue, isResolved), achievements[]</text><text x="66" y="618" font-family="Arial" font-size="14" fill="#334155">hoursBreakdown, notes, links[]</text><text x="66" y="642" font-family="Arial" font-size="14" fill="#334155">latestReviewComment, latestReviewedBy -&gt; User</text><text x="66" y="666" font-family="Arial" font-size="14" fill="#334155">versions[] (embedded), createdAt, updatedAt</text><rect x="670" y="430" width="470" height="270" rx="12" fill="white" stroke="#cbd5e1"/><rect x="670" y="430" width="470" height="42" rx="12" fill="#0f172a"/><text x="686" y="458" fill="white" font-family="Arial" font-weight="bold" font-size="17">REPORT VERSION (embedded)</text><text x="686" y="498" font-family="Arial" font-size="14" fill="#334155">versionNumber, submittedAt</text><text x="686" y="522" font-family="Arial" font-size="14" fill="#334155">snapshot: complete submitted report content</text><text x="686" y="546" font-family="Arial" font-size="14" fill="#334155">project identity and name captured in snapshot</text><text x="686" y="570" font-family="Arial" font-size="14" fill="#334155">reviewAction: pending / approved / changes_requested</text><text x="686" y="594" font-family="Arial" font-size="14" fill="#334155">reviewComment, reviewedAt</text><text x="686" y="618" font-family="Arial" font-size="14" fill="#334155">reviewedBy -&gt; User</text><text x="686" y="642" font-family="Arial" font-size="14" fill="#334155">Content preserved across correction/resubmission</text><text x="50" y="756" font-family="Arial" font-size="15" fill="#475569">Manager / Admin is one role. Reviews live within report versions; no separate review collection is used.</text><text x="50" y="785" font-family="Arial" font-size="15" fill="#475569">Referenced projects and users are archived/deactivated to preserve report history.</text></svg>